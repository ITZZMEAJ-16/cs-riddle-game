<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 2 - The Ghost Variable</title>
    <style>
        body { background: #0f141c; color: #58a6ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        input { background: #0d1117; border: 1px solid #30363d; color: #58a6ff; padding: 10px; text-align: center; width: 80%; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 2: The Ghost Variable</h2>
        <p>Memory leaves ghosts. Inspect the page code parameters to extract the entry validation key.</p>
        <input type="text" id="answer" placeholder="Enter key flags here...">
        <p style="font-size: 12px; opacity: 0.6;">Hint: Execute the handleSubmission() function manually via the DevTools console.</p>
    </div>

    <script>
        const internal_key = "console_ninja";
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        const failAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');

        document.addEventListener('keydown', () => { successAudio.load(); failAudio.load(); }, { once: true });

        async function handleSubmission() {
            const val = document.getElementById('answer').value;
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: val })
            });
            const data = await res.json();
            
            if (data.success) {
                successAudio.play().catch(p => console.log(p));
                setTimeout(() => { window.location.href = data.nextLevel; }, 600);
            } else {
                failAudio.play().catch(p => console.log(p));
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
