<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 1 - The Cryptographic Gateway</title>
    <style>
        body { background: #0b1a10; color: #39ff14; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #050f08; border: 1px solid #39ff14; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        input { background: #000; border: 1px solid #39ff14; color: #39ff14; padding: 10px; text-align: center; width: 80%; margin-bottom: 15px; }
        button { background: #39ff14; color: black; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 1: The Cryptographic Gateway</h2>
        <p>Decode this radix-64 representation architecture payload string to clear authorization:</p>
        <code style="color: #a2ffa2; font-size: 18px;">NDgxNTE2MjM0Mg==</code>
        <br><br>
        <form onsubmit="submitLevel(event)">
            <input type="text" id="ansInput" placeholder="Enter numerical sequence">
            <br>
            <button type="submit">AUTHORIZE LINK</button>
        </form>
    </div>

    <script>
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        const failAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');

        document.addEventListener('keydown', () => { successAudio.load(); failAudio.load(); }, { once: true });

        async function submitLevel(e) {
            e.preventDefault();
            const val = document.getElementById('ansInput').value;
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: val })
            });
            const data = await res.json();
            
            if (data.success) {
                successAudio.play().catch(p => console.log(p));
                setTimeout(() => { window.location.href = data.nextLevel; }, 600);
            } else {
                failAudio.play().catch(p => console.log(p));
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
