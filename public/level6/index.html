<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 6 - Binary Core</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #222; border: 1px solid #333; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        input { background: #000; border: 1px solid #555; color: #fff; padding: 10px; text-align: center; width: 80%; font-size: 16px; margin-bottom: 15px; }
        button { background: #fff; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 6: Hardware Register Matrix</h2>
        <p>Convert this active 8-bit registers string byte structure into an alphanumeric character mapping:</p>
        <h1 style="color:#ff5252; letter-spacing:4px; font-size: 42px; margin: 20px 0;">01101001</h1>
        <p style="font-size: 13px; opacity: 0.7;">Hint: Think ASCII conversions for standard lowercase letters.</p>
        <br>
        <form onsubmit="submitLevel(event)">
            <input type="text" id="ans" placeholder="Enter text character">
            <br>
            <button type="submit">LOAD KEY REGISTER</button>
        </form>
    </div>

    <script>
        function playSynthSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
            const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, ctx.currentTime); osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            }
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
        }

        async function submitLevel(e) {
            e.preventDefault();
            const val = document.getElementById('ans').value;
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: val })
            });
            const data = await res.json();
            
            if (data.success) {
                playSynthSound('success');
                setTimeout(() => { window.location.href = data.nextLevel; }, 500);
            } else {
                playSynthSound('fail');
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
