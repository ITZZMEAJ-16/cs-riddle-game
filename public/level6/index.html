<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 6 - Binary Core</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #222; border: 1px solid #333; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        input { background: #000; border: 1px solid #555; color: #fff; padding: 10px; text-align: center; width: 80%; font-size: 16px; margin-bottom: 15px; }
        button { background: #fff; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 6: Hardware Register Matrix</h2>
        <p>Convert this active 8-bit registers string byte structure into an alphanumeric character mapping:</p>
        <h1 style="color:#ff5252; letter-spacing:4px; font-size: 42px; margin: 20px 0;">01101001</h1>
        <p style="font-size: 13px; opacity: 0.7;">Hint: Think ASCII structure transformations for standard lowercase letters.</p>
        <br>
        <form onsubmit="submitLevel(event)">
            <input type="text" id="ans" placeholder="Enter text character">
            <br>
            <button type="submit">LOAD KEY REGISTER</button>
        </form>
    </div>

    <script>
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        const failAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');

        document.addEventListener('keydown', () => { successAudio.load(); failAudio.load(); }, { once: true });

        async function submitLevel(e) {
            e.preventDefault();
            const val = document.getElementById('ans').value;
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: val })
            });
            const data = await res.json();
            
            if (data.success) {
                successAudio.play().catch(p => console.log(p));
                setTimeout(() => { window.location.href = data.nextLevel; }, 600);
            } else {
                failAudio.play().catch(p => console.log(p));
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
