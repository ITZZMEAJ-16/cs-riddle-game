<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Enigma Core | Registration Gate</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .gate-container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 6px;
            width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { 
            color: #58a6ff; 
            margin-top: 0; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 10px; 
        }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #8b949e; }
        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 4px;
            font-family: monospace;
            box-sizing: border-box;
        }
        input:focus { border-color: #58a6ff; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #2ea043; }
        .error-msg { color: #f85149; font-size: 12px; margin-top: 15px; display: none; padding: 10px; background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.2); border-radius: 4px; }
        .success-msg { color: #56d364; font-size: 12px; margin-top: 15px; display: none; padding: 10px; background: rgba(86, 211, 100, 0.1); border: 1px solid rgba(86, 211, 100, 0.2); border-radius: 4px; }
        .hidden-panel { display: none; }
    </style>
</head>
<body>

<div class="gate-container">
    <h2>🔐 ENIGMA GATEWAY</h2>
    
    <!-- PHASE 1: EMAIL VERIFICATION -->
    <div id="email-panel">
        <div class="input-group">
            <label>FULL NAME</label>
            <input type="text" id="player-name" placeholder="Enter full name" required>
        </div>
        <div class="input-group">
            <label>REGISTERED EMAIL ADDRESS</label>
            <input type="email" id="player-email" placeholder="student@college.edu" required>
        </div>
        <button id="btn-request-otp">REQUEST ACCESS TOKEN</button>
    </div>

    <!-- PHASE 2: OTP VERIFICATION (HIDDEN BY DEFAULT) -->
    <div id="otp-panel" class="hidden-panel">
        <p style="font-size: 12px; color: #8b949e; line-height: 1.4;">An operational security token has been dispatched to your registered email address.</p>
        <div class="input-group">
            <label>ENTER 6-DIGIT OTP</label>
            <input type="text" id="otp-code" placeholder="XXXXXX" maxlength="6" style="text-align: center; letter-spacing: 4px; font-size: 18px;">
        </div>
        <button id="btn-verify-otp">VERIFY & ENTER SYSTEM</button>
    </div>

    <div id="error-box" class="error-msg"></div>
    <div id="success-box" class="success-msg"></div>
</div>

<script>
    const BACKEND_URL = 'https://cs-riddle-game.onrender.com';
    
    const emailPanel = document.getElementById('email-panel');
    const otpPanel = document.getElementById('otp-panel');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        successBox.style.display = 'none';
    }

    function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.style.display = 'block';
        errorBox.style.display = 'none';
    }

    // Phase 1: Submit Identity Parameters
    document.getElementById('btn-request-otp').addEventListener('click', async () => {
        const name = document.getElementById('player-name').value.trim();
        const email = document.getElementById('player-email').value.trim();

        if (!name || !email) {
            showError("Please fill out all credentials.");
            return;
        }

        showSuccess("Verifying identity with cluster...");

        try {
            const response = await fetch(`${BACKEND_URL}/api/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            const data = await response.json();

            if (data.success) {
                showSuccess("Identity verified. Check your email for the access token.");
                emailPanel.classList.add('hidden-panel');
                otpPanel.classList.remove('hidden-panel');
                document.getElementById('otp-code').focus();
            } else {
                showError(data.message || "Access Denied: Unregistered participant.");
            }
        } catch (err) {
            showError("Internal cloud communication routing fault.");
        }
    });

    // Phase 2: Verify Access Token
    document.getElementById('btn-verify-otp').addEventListener('click', async () => {
        const email = document.getElementById('player-email').value.trim();
        const otpCode = document.getElementById('otp-code').value.trim();

        if (!otpCode) {
            showError("Please enter the security token.");
            return;
        }

        showSuccess("Validating token alignment...");

        try {
            const response = await fetch(`${BACKEND_URL}/api/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otpCode })
            });
            const data = await response.json();

            if (data.success && data.redirect) {
                showSuccess("Access Granted. Redirecting...");
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1000);
            } else {
                showError(data.message || "Invalid security code reference.");
            }
        } catch (err) {
            showError("Verification processing system fault.");
        }
    });
</script>

</body>
</html>
