<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 7 - Color Vector</title>
    <style>
        body { background: #1a130b; color: #ffb86c; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #4d3318; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        .color-box { width: 120px; height: 120px; background-color: #deadbeef; margin: 20px auto; border: 2px solid white; border-radius: 4px; }
        input { background: #222; border: 1px solid #ffb86c; color: white; padding: 10px; text-align: center; width: 80%; margin-bottom: 15px; }
        button { background: #ffb86c; color: black; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 7: The System Hex Memory Block</h2>
        <p>The color assigned to the structural block element below is set via a distinct computing signature word.</p>
        <div class="color-box"></div>
        <p>Inspect the <strong>computed background style</strong> value of this container block to trace the exact hex validation string value.</p>
        <br>
        <form onsubmit="submitLevel(event)">
            <input type="text" id="ans" placeholder="Enter hex word flag">
            <br>
            <button type="submit">COMMIT ADDRESS LINK</button>
        </form>
    </div>

    <script>
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        const failAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');

        document.addEventListener('keydown', () => { successAudio.load(); failAudio.load(); }, { once: true });

        async function submitLevel(e) {
            e.preventDefault();
            const val = document.getElementById('ans').value;
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: val })
            });
            const data = await res.json();
            
            if (data.success) {
                successAudio.play().catch(p => console.log(p));
                setTimeout(() => { window.location.href = data.nextLevel; }, 600);
            } else {
                failAudio.play().catch(p => console.log(p));
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
