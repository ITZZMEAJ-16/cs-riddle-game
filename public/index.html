<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Sandbox Enigma</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding: 50px; }
        button { background: #238636; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 20px; font-family: monospace; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <h1>[ THE SANDBOX ENIGMA ]</h1>
    <p>A multi-level terminal challenge testing your structural logic, technical deduction, and engineering intuition.</p>
    <button onclick="startGame()">INITIALIZE SYSTEM</button>

    <script>
        const startAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        async function startGame() {
            startAudio.play().catch(e => console.log(e));
            const res = await fetch('/api/start', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                setTimeout(() => { window.location.href = data.redirect; }, 400);
            }
        }
    </script>
</body>
</html>
