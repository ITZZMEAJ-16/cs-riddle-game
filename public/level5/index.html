<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 5 - In Plain Sight</title>
    <style>
        body { background: #0b1414; color: #00ffff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #0a4040; padding: 40px; border-radius: 8px; text-align: center; max-width: 450px; transition: transform 0.1s ease; }
        /* The key is hidden inside this CSS comment tag architecture! Hidden Flag: hidden_in_plain_sight */
        input { background: #000; border: 1px solid #0a4040; color: white; padding: 10px; width: 80%; margin-bottom: 15px; text-align: center; }
        button { background: #00ffff; color: black; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Level 5: Steganographic Stylesheets</h2>
        <p>The solution array is embedded directly inside the active presentation stylesheet rule layer.</p>
        <p>Open <strong>DevTools Sources or Elements style inspector</strong> to comb the document stylesheets layout parameters.</p>
        <br>
        <form onsubmit="submitLevel(event)">
            <input type="text" id="ans" placeholder="Enter stylesheet string">
            <br>
            <button type="submit">SUBMIT PARSED FLAG</button>
        </form>
    </div>

    <script>
        const successAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav');
        const failAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');

        document.addEventListener('keydown', () => { successAudio.load(); failAudio.load(); }, { once: true });

        async function submitLevel(e) {
            e.preventDefault();
            const res = await fetch('/api/submit-answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer: document.getElementById('ans').value })
            });
            const data = await res.json();
            
            if (data.success) {
                successAudio.play().catch(p => console.log(p));
                setTimeout(() => { window.location.href = data.nextLevel; }, 600);
            } else {
                failAudio.play().catch(p => console.log(p));
                const card = document.querySelector('.card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => { card.style.transform = 'translateX(-10px)'; }, 50);
                setTimeout(() => { card.style.transform = 'translateX(0)'; }, 100);
            }
        }
    </script>
</body>
</html>
