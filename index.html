<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddle Game - Level 10</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117; /* Dark background */
            color: #c9d1d9; /* Light text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 128, 0, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 128, 0, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: grid-pan 60s linear infinite;
            z-index: -1;
        }
        @keyframes grid-pan {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 400px 400px;
            }
        }
        .container {
            background-color: #161b22; /* Slightly lighter dark for container */
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #56d364; /* Green accent */
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(86, 211, 100, 0.5);
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
            border-radius: 5px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 1em;
        }
        button {
            background-color: #238636; /* Green button */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            border: 1px solid #238636;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }
        button:hover {
            box-shadow: 0 0 10px rgba(46, 160, 67, 0.7);
            background-color: #2ea043;
        }
        #message {
            margin-top: 20px;
            color: #f85149; /* Red for error messages */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Level 10: The Unveiled Truth</h1>
        <p>I am the message, clear and free, before any locks are put on me. What am I?</p>
        <form id="riddleForm">
            <input type="text" id="answerInput" placeholder="Enter your answer" required>
            <button type="submit">Submit</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById('riddleForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const answer = document.getElementById('answerInput').value;
            const messageElement = document.getElementById('message');

            try {
                const response = await fetch('/api/submit-answer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ answer })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.nextLevel;
                } else {
                    messageElement.textContent = data.message;
                    messageElement.style.color = '#f85149'; // Red for error
                }
            } catch (error) {
                console.error('Error submitting answer:', error);
                messageElement.textContent = 'An unexpected error occurred.';
                messageElement.style.color = '#f85149';
            }
        });
    </script>
</body>
</html>
